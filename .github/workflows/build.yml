name: Build Entel Client
on:
  push:
    paths:
      - 'src/**'
      - '**/*.gradle'
      - '**/*.gradle.kts'
      - 'gradle.properties'
      - 'gradle/**'
      - 'gradlew'
      - 'gradlew.bat'
      - '.github/workflows/build.yml'
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.2.1'
      - name: Set build version
        run: echo "CLIENT_VERSION=0.1.$((2 + GITHUB_RUN_NUMBER - ${BASE_RUN:-$GITHUB_RUN_NUMBER}))" >> "$GITHUB_ENV"
      - run: gradle build -PclientVersion=$CLIENT_VERSION
      - uses: actions/upload-artifact@v4
        with:
          name: EntelClient-${{ env.CLIENT_VERSION }}
          path: build/libs/*.jar
