plugins { id 'fabric-loom' version '1.14-SNAPSHOT' }
version = providers.gradleProperty('clientVersion').getOrElse('0.1.2')
group = 'dev.entel'
repositories { mavenCentral(); maven { url = 'https://maven.fabricmc.net/' } }
dependencies { minecraft 'com.mojang:minecraft:1.21.11'; mappings loom.officialMojangMappings(); modImplementation 'net.fabricmc:fabric-loader:0.18.4'; modImplementation 'net.fabricmc.fabric-api:fabric-api:0.141.3+1.21.11' }
java { toolchain { languageVersion = JavaLanguageVersion.of(21) } }

processResources { inputs.property 'version', project.version; filesMatching('fabric.mod.json') { expand(version: project.version) } }
